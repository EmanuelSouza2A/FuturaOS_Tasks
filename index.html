<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>FuturaOS Login</title>
    <style>
        body { background: #020408; color: #e8f4ff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .glass { background: rgba(255,255,255,0.05); padding: 40px; border-radius: 20px; border: 1px solid #00d4ff33; width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #4a6a8a; background: #060a14; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #7c3aed; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="glass" id="loginScreen">
    <h2>Login FuturaOS</h2>
    <input type="email" id="email" placeholder="E-mail">
    <input type="password" id="senha" placeholder="Senha">
    <input type="text" id="codigo" placeholder="Código de Acesso">
    <button onclick="login()">Entrar</button>
</div>

<script>
    // ESTA É A SUA URL DE IMPLANTAÇÃO (A QUE TERMINA EM /exec)
    const URL_API = "https://script.google.com/macros/s/AKfycbyCr9-XLZC9HZjPtwEsm-f6o0RUdDqpzVph-cIR7pc7ubDCsRqDd5Yf0Q8jzMOmKecIAQ/exec";

    async function login() {
        const e = document.getElementById('email').value;
        const s = document.getElementById('senha').value;
        const c = document.getElementById('codigo').value;

        try {
            const url = `${URL_API}?email=${encodeURIComponent(e)}&senha=${encodeURIComponent(s)}&codigo=${encodeURIComponent(c)}`;
            const response = await fetch(url);
            const data = await response.json();

            if (data.status === true) {
                alert("Sucesso! Bem-vindo.");
                // Aqui você pode redirecionar ou esconder a tela de login
            } else {
                alert("Acesso negado: Verifique seus dados.");
            }
        } catch (err) {
            alert("Erro de comunicação com a planilha. Verifique sua conexão.");
            console.error(err);
        }
    }
</script>
</body>
</html>
