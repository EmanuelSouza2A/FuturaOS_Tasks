<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#020408;--cyan:#00d4ff;--purple:#7c3aed;--pink:#ec4899;
  --green:#00ff88;--orange:#ff6b00;--red:#ef4444;

html,body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;font-family:'Inter',sans-serif}
.hidden{display:none!important}
#particles{position:fixed;inset:0;z-index:0;pointer-events:none}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;

  linear-gradient(90deg,rgba(0,212,255,0.025) 1px,transparent 1px);
  background-size:50px 50px;
  mask-image:radial-gradient(ellipse 85% 85% at 50% 50%,black,transparent);
  -webkit-mask-image:radial-gradient(ellipse 85% 85% at 50% 50%,black,transparent)}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.au{position:absolute;border-radius:50%}
.au1{width:900px;height:900px;background:radial-gradient(circle,rgba(0,212,255,0.055),transparent 70%);top:-250px;left:-250px;animation:au1 14s ease-in-out infinite}

@keyframes au1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(120px,90px) scale(1.12)}}
@keyframes au2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-90px,-70px) scale(1.18)}}

.scanline{position:fixed;inset:0;z-index:1;pointer-events:none;

@keyframes scan{from{background-position:0 0}to{background-position:0 200px}}

.notify.show{transform:translateY(0);opacity:1}

<script>
'use strict';

// ── ANTI-DEVTOOLS ──
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if (
    e.key === 'F12' ||
    (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) ||
    (e.ctrlKey && ['U','S'].includes(e.key.toUpperCase()))
  ) { e.preventDefault(); return false; }
});
const devBlock = () => {
  if (window.outerWidth - window.innerWidth > 160 || window.outerHeight - window.innerHeight > 160) {
    mostrarViolacao('DEV_TOOLS_DETECTED', 'DevTools detectado. Feche as ferramentas de desenvolvedor para continuar.');
  }
};
setInterval(devBlock, 1000);

// ── PARTÍCULAS ──
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let W, H;
const COLORS = ['0,212,255','124,58,237','236,72,153','0,255,136','255,107,0'];
let pts = [];
function resizeCanvas() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
for (let i = 0; i < 95; i++) {
  pts.push({ x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.8+0.3,
    dx:(Math.random()-0.5)*0.45, dy:(Math.random()-0.5)*0.45,
    o:Math.random()*0.5+0.1, c:COLORS[Math.floor(Math.random()*COLORS.length)] });
}
function drawParticles() {
  ctx.clearRect(0,0,W,H);
  pts.forEach(p => {
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(${p.c},${p.o})`; ctx.fill();
    p.x+=p.dx; p.y+=p.dy;
    if(p.x<0||p.x>W) p.dx*=-1;
    if(p.y<0||p.y>H) p.dy*=-1;
  });
  pts.forEach((a,i) => {
    for(let j=i+1;j<pts.length;j++){
      const b=pts[j], d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<120){ ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
        ctx.strokeStyle=`rgba(0,212,255,${0.065*(1-d/120)})`; ctx.lineWidth=0.5; ctx.stroke(); }
    }
  });
  requestAnimationFrame(drawParticles);
}
drawParticles();

document.addEventListener('mousemove', e => {
  const g = document.getElementById('cursorGlow');
  g.style.left = e.clientX+'px'; g.style.top = e.clientY+'px';
});

// ── NOTIFY ──
let notifyTimer = null;
function showNotify(icon, title, sub) {
  document.getElementById('notifyIcon').textContent = icon;
  document.getElementById('notifyTitle').textContent = title;
  document.getElementById('notifySub').textContent = sub;
  const el = document.getElementById('notify');
  el.classList.add('show');
  clearTimeout(notifyTimer);
  notifyTimer = setTimeout(() => el.classList.remove('show'), 4500);
}

// ── CONFIG ──
const WORKER_URL = 'https://fancy-sunset-fd9e.souzacarisemanuelfelipe4.workers.dev'; // ← URL de produção definitiva configurada
const TEMPO_LIVRE_SEG = 600;

// ── USER ID PERSISTENTE ──
function getUserId() {
  let id = localStorage.getItem('ft_user_id');
  if (!id) {
    id = 'ft_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('ft_user_id', id);
  }
  return id;
}

// ── ESTADO DE ACESSO ──
let modoAcesso = null; // 'premium' | 'gratuito'
let timerInterval = null;
let timerSegRestante = TEMPO_LIVRE_SEG;
let timerAtivo = false;
let timerFoiIniciado = false;

// ── VIOLAÇÃO DE SEGURANÇA ──
function mostrarViolacao(codigo, mensagem) {
  const old = document.getElementById('violationOverlay');
  if (old) return;
  const overlay = document.createElement('div');
  overlay.id = 'violationOverlay';
  overlay.className = 'violation-overlay';
  overlay.innerHTML = `
    <div class="violation-box">
      <div class="violation-icon">🔒</div>
      <div class="violation-title">Acesso Bloqueado</div>
      <div class="violation-sub">${mensagem}</div>
      <button class="btn btn-ghost" style="width:100%" onclick="location.reload()">↺ Recarregar página</button>
      <div class="violation-code">ERR_CODE: ${codigo} // FuturaOS_ZeroTrust_v4</div>
    </div>`;
  document.body.appendChild(overlay);
  pararTimer();
}

// ── CICLO DE VIDA: RESET AO SAIR/TROCAR ABA ──
window.addEventListener('beforeunload', () => { pararTimer(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && timerAtivo && modoAcesso !== 'premium') {
    pararTimer();
    timerSegRestante = TEMPO_LIVRE_SEG;
    timerFoiIniciado = false;
    atualizarDisplayTimer(TEMPO_LIVRE_SEG);
    document.getElementById('timerLabel').textContent = 'REINICIADO — troca de aba detectada';
    document.getElementById('timerBtn').textContent = '▶ Iniciar contagem gratuita';
    document.getElementById('timerBtn').disabled = false;
    document.getElementById('timerBarFill').style.width = '100%';
    showNotify('⚠️','Cronômetro reiniciado','Você trocou de aba. Reinicie a contagem.');
  }
});

// ── TIMER ──
function atualizarDisplayTimer(seg) {
  const m = String(Math.floor(seg / 60)).padStart(2,'0');
  const s = String(seg % 60).padStart(2,'0');
  document.getElementById('timerDisplay').textContent = `${m}:${s}`;
  const pct = (seg / TEMPO_LIVRE_SEG) * 100;
  document.getElementById('timerBarFill').style.width = pct + '%';
}

function pararTimer() {
  clearInterval(timerInterval);
  timerAtivo = false;
}

async function iniciarTimer() {
  if (timerAtivo) return;
  const btn = document.getElementById('timerBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Conectando ao servidor...';

  try {
    const res = await fetch(`${WORKER_URL}/api/start-free`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: getUserId() })
    });
    const data = await res.json();

    if (data.status === 'em_andamento') {
      timerSegRestante = data.restanteSeg;
      showNotify('🔄','Sessão retomada',`${data.restanteSeg}s restantes no servidor`);
    } else {
      timerSegRestante = TEMPO_LIVRE_SEG;
    }

    timerAtivo = true;
    timerFoiIniciado = true;
    document.getElementById('timerLabel').textContent = 'CRONÔMETRO DO SERVIDOR ATIVO';
    btn.textContent = '⏱ Aguardando liberação...';

    timerInterval = setInterval(() => {
      if (timerSegRestante <= 0) {
        pararTimer();
        document.getElementById('timerLabel').textContent = '✅ TEMPO CONCLUÍDO — ACESSO LIBERADO';
        document.getElementById('timerDisplay').textContent = '00:00';
        document.getElementById('timerBarFill').style.width = '0%';
        modoAcesso = 'gratuito';
        setTimeout(enterMain, 1200);
        return;
      }
      timerSegRestante--;
      atualizarDisplayTimer(timerSegRestante);
    }, 1000);

  } catch {
    btn.disabled = false;
    btn.textContent = '▶ Tentar novamente';
    showNotify('❌','Erro de conexão','Não foi possível conectar ao servidor.');
  }
}

// ── PREMIUM ──
function onPremiumClick() {
  showNotify('💳','Redirecionando...','Após o pagamento, o botão abaixo será desbloqueado automaticamente.');
}

async function validarPremium() {
  showNotify('🔄','Verificando...','Consultando banco de dados na nuvem...');
  
  try {
    const res = await fetch(`${WORKER_URL}/api/get-script`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: getUserId(), scriptId: 1 })
    });

    const data = await res.json();

    if (res.ok && data.status === 'liberado') {
      modoAcesso = 'premium';
      localStorage.setItem('ft_modo', 'premium');
      showNotify('👑', 'Acesso Premium!', 'Confirmado! Todos os 22 scripts estão liberados.');
      enterMain(); 
    } else {
      showNotify('❌', 'Não Liberado', 'Nenhum pagamento aprovado foi encontrado no servidor.');
      const btn = document.getElementById('btnPremium');
      if (btn) {
        btn.disabled = true;
        btn.style.opacity = "0.6";
        btn.style.cursor = "not-allowed";
        btn.innerHTML = "🔒 Aguardando Confirmação do Pagamento...";
      }
    }
  } catch (error) {
    showNotify('❌', 'Erro', 'Não foi possível conectar ao servidor Cloudflare.');
  }
}

// Polling: Verifica o status no KV da Cloudflare a cada 5 segundos em segundo plano
async function checarPixAutomatico() {
  if (localStorage.getItem('ft_modo') === 'premium') return;
  
  try {
    const res = await fetch(`${WORKER_URL}/api/get-script`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: getUserId(), scriptId: 1 })
    });
    const data = await res.json();
    
    if (res.ok && data.status === 'liberado') {
      const btn = document.getElementById('btnPremium');
      if (btn) {
        btn.disabled = false; 
        btn.style.opacity = "1";
        btn.style.cursor = "pointer";
        btn.style.background = "linear-gradient(135deg, #00ff88, #0ea5e9)";
        btn.innerHTML = "🚀 Pix Confirmado! Clique para Entrar como Premium";
      }
      modoAcesso = 'premium';
      localStorage.setItem('ft_modo', 'premium');
    }
  } catch (e) { /* Abafa logs de conexão em background */ }
}
setInterval(checarPixAutomatico, 5000);

// ── RENDER CARDS ──
function renderCards() {
  document.getElementById('cardsGrid').innerHTML = scripts.map((s,i) => `
    <article class="card" onclick="openDetail(${s.id})" style="animation-delay:${(i*0.04).toFixed(2)}s">
      <div class="card-topline"></div><div class="card-sweep"></div><div class="card-glow"></div>
      <div class="card-header">
        <span class="card-code">// script_${String(s.id).padStart(2,'0')}</span>
        <span class="status-pill"><span class="s-dot"></span>online</span>
      </div>
      <div class="card-title">${s.title}</div>
      <p class="card-desc">${s.desc}</p>
      <div class="card-author">por ${s.author}</div>
      <div class="card-num">#${String(s.id).padStart(2,'0')}</div>
    </article>`).join('');
}

// ── ABRIR DETALHE — requisição ao Worker ──
async function openDetail(id) {
  const s = scripts.find(x => x.id === id);
  if (!s) return;

  document.getElementById('detailTitle').textContent   = s.title;
  document.getElementById('detailDesc').textContent    = s.desc;
  document.getElementById('detailAuthor').textContent  = s.author;
  document.getElementById('detailDate').textContent    = s.date;
  document.getElementById('detailRoute').textContent   = s.route;
  document.getElementById('detailUpdated').textContent = '// Atualizado em ' + s.date;
  document.getElementById('detailId').textContent      = '';
  document.getElementById('detailCode').classList.add('hidden');
  document.getElementById('copyCodeBtn').classList.add('hidden');
  document.getElementById('loadingBox').classList.remove('hidden');

  document.getElementById('mainPage').classList.add('hidden');
  document.getElementById('detailPage').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });

  try {
    const res = await fetch(`${WORKER_URL}/api/get-script`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-User-Id': getUserId()
      },
      body: JSON.stringify({
        userId:   getUserId(),
        scriptId: id,
        jaPagou:  modoAcesso === 'premium'
      })
    });

    const data = await res.json();

    if (res.ok && data.status === 'liberado') {
      document.getElementById('loadingBox').classList.add('hidden');
      document.getElementById('detailCode').textContent = data.code;
      document.getElementById('detailCode').classList.remove('hidden');
      document.getElementById('copyCodeBtn').classList.remove('hidden');
    } else {
      document.getElementById('loadingBox').classList.add('hidden');
      const codigo = data.codigo || 'ACCESS_DENIED';
      const msg    = data.mensagem || 'Acesso negado pelo servidor.';
      mostrarViolacaoInline(codigo, msg, data.restanteSeg);
    }

  } catch {
    document.getElementById('loadingBox').classList.add('hidden');
    mostrarViolacaoInline('CONNECTION_ERROR', 'Não foi possível conectar ao servidor de segurança.');
  }
}

function mostrarViolacaoInline(codigo, mensagem, restanteSeg) {
  const tempoTxt = restanteSeg ? `<br><br>⏱ Aguarde mais <strong style="color:var(--cyan)">${restanteSeg}s</strong> no cronômetro.` : '';
  document.getElementById('codeBlock').innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;padding:36px;text-align:center">
      <div style="font-size:44px">⛔</div>
      <div style="font-size:16px;font-weight:800;color:var(--red)">Acesso Negado</div>
      <div style="font-size:13px;color:var(--muted);line-height:1.75">${mensagem}${tempoTxt}</div>
      <button class="btn btn-ghost" style="margin-top:8px" onclick="goBack()">← Voltar</button>
      <div style="font-size:10px;color:rgba(239,68,68,0.3);font-family:'JetBrains Mono',monospace">ERR: ${codigo}</div>
    </div>`;
}

function copyCode() {
  const btn  = document.getElementById('copyCodeBtn');
  const orig = btn.innerHTML;
  navigator.clipboard.writeText(document.getElementById('detailCode').textContent).then(() => {
    btn.innerHTML = '✅ Copiado!';
    btn.style.background = 'linear-gradient(135deg,#00ff88,#0ea5e9)';
    showNotify('📋','Código copiado!','Cole no console do navegador.');
    setTimeout(() => { btn.innerHTML = orig; btn.style.background = ''; }, 2500);
  }).catch(() => {
    btn.innerHTML = '⚠️ Erro ao copiar';
    setTimeout(() => { btn.innerHTML = orig; }, 2000);
  });
}
