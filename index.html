<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>FuturaOS_Tasks</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#020408;
  --cyan:#00d4ff;--purple:#7c3aed;--pink:#ec4899;--green:#00ff88;--orange:#ff6b00;
  --text:#e8f4ff;--muted:#4a6a8a;
  --border:rgba(0,212,255,0.08);--border-hi:rgba(0,212,255,0.22);
}
html,body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;font-family:'Inter',sans-serif}
.hidden{display:none!important}

/* FUNDO */
#particles{position:fixed;inset:0;z-index:0;pointer-events:none}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(0,212,255,0.025) 1px,transparent 1px),
  linear-gradient(90deg,rgba(0,212,255,0.025) 1px,transparent 1px);
  background-size:50px 50px;
  mask-image:radial-gradient(ellipse 85% 85% at 50% 50%,black,transparent);
  -webkit-mask-image:radial-gradient(ellipse 85% 85% at 50% 50%,black,transparent)}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.au{position:absolute;border-radius:50%}
.au1{width:900px;height:900px;background:radial-gradient(circle,rgba(0,212,255,0.055),transparent 70%);top:-250px;left:-250px;animation:au1 14s ease-in-out infinite}
.au2{width:750px;height:750px;background:radial-gradient(circle,rgba(124,58,237,0.065),transparent 70%);bottom:-200px;right:-150px;animation:au2 17s ease-in-out infinite}
.au3{width:550px;height:550px;background:radial-gradient(circle,rgba(236,72,153,0.04),transparent 70%);top:35%;left:35%;transform:translate(-50%,-50%);animation:au3 11s ease-in-out infinite}
@keyframes au1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(120px,90px) scale(1.12)}}
@keyframes au2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-90px,-70px) scale(1.18)}}
@keyframes au3{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.25)}}
.scanline{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.012) 3px,rgba(0,0,0,0.012) 6px);
  animation:scan 12s linear infinite}
@keyframes scan{from{background-position:0 0}to{background-position:0 200px}}
.cursor-glow{position:fixed;width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,212,255,0.03),transparent 70%);
  pointer-events:none;transform:translate(-50%,-50%);z-index:1;will-change:left,top}

/* NOTIFICAÇÃO */
.notify{position:fixed;bottom:28px;right:28px;z-index:9999;
  background:rgba(6,10,20,0.95);border:1px solid rgba(0,255,136,0.3);border-radius:16px;
  padding:16px 22px;display:flex;align-items:center;gap:14px;
  box-shadow:0 0 40px rgba(0,255,136,0.1),0 20px 60px rgba(0,0,0,0.6);
  backdrop-filter:blur(24px);transform:translateY(120px);opacity:0;
  transition:all .45s cubic-bezier(.16,1,.3,1);min-width:260px}
.notify.show{transform:translateY(0);opacity:1}
.notify-icon{font-size:22px;flex-shrink:0}
.notify-title{font-size:14px;font-weight:700;color:var(--text)}
.notify-sub{font-size:12px;color:var(--muted);margin-top:3px;font-family:'JetBrains Mono',monospace}

/* COMPONENTES BASE */
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 20px;position:relative;z-index:10}
.glass{width:100%;max-width:960px;background:rgba(6,10,20,0.88);
  border:1px solid var(--border-hi);
  box-shadow:0 0 80px rgba(0,212,255,0.04),0 40px 100px rgba(0,0,0,0.85),inset 0 1px 0 rgba(0,212,255,0.08);
  backdrop-filter:blur(36px);border-radius:28px;padding:48px;position:relative;overflow:hidden;
  animation:boxIn .8s cubic-bezier(.16,1,.3,1) both}
@keyframes boxIn{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}
.glass::before{content:"";position:absolute;top:0;left:12%;right:12%;height:1px;
  background:linear-gradient(90deg,transparent,var(--cyan),var(--purple),var(--pink),transparent)}
.glass::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 35% at 50% 0%,rgba(0,212,255,0.04),transparent)}
.corner{position:absolute;width:20px;height:20px;border-color:var(--cyan);border-style:solid;animation:cornerPulse 3s ease-in-out infinite}
.corner.tl{top:14px;left:14px;border-width:2px 0 0 2px}
.corner.tr{top:14px;right:14px;border-width:2px 2px 0 0}
.corner.bl{bottom:14px;left:14px;border-width:0 0 2px 2px}
.corner.br{bottom:14px;right:14px;border-width:0 2px 2px 0}
@keyframes cornerPulse{0%,100%{opacity:.25}50%{opacity:.8}}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:999px;
  background:linear-gradient(135deg,rgba(0,212,255,0.07),rgba(124,58,237,0.07));
  border:1px solid rgba(0,212,255,0.18);color:var(--cyan);font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;margin-bottom:28px;
  animation:badgePulse 3s ease-in-out infinite}
@keyframes badgePulse{0%,100%{box-shadow:0 0 0 0 rgba(0,212,255,0)}50%{box-shadow:0 0 25px rgba(0,212,255,0.15)}}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.2;transform:scale(.7)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* BOTÕES E INPUTS */
.btn{border:none;cursor:pointer;border-radius:14px;padding:15px 28px;font-size:15px;font-weight:700;
  font-family:'Inter',sans-serif;display:inline-flex;align-items:center;justify-content:center;
  gap:10px;text-decoration:none;position:relative;overflow:hidden;
  transition:all .3s cubic-bezier(.16,1,.3,1)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(45deg,transparent 30%,rgba(255,255,255,0.1) 50%,transparent 70%);transform:translateX(-100%);transition:.55s}
.btn:hover::after{transform:translateX(100%)}
.btn-primary{background:linear-gradient(135deg,#0ea5e9,var(--purple),var(--pink));color:#fff;
  box-shadow:0 0 40px rgba(0,212,255,0.12),0 8px 28px rgba(0,0,0,0.4)}
.btn-primary:hover{transform:translateY(-3px) scale(1.02);
  box-shadow:0 0 60px rgba(0,212,255,0.25),0 20px 50px rgba(0,0,0,0.5)}
.btn-ghost{background:rgba(0,212,255,0.05);color:var(--text);border:1px solid var(--border-hi)}
.btn-ghost:hover{background:rgba(0,212,255,0.1);border-color:var(--cyan);
  transform:translateY(-2px);box-shadow:0 0 30px rgba(0,212,255,0.1)}
.login-input{background:rgba(255,255,255,0.03);border:1px solid var(--border-hi);border-radius:12px;
  padding:14px 16px;color:#fff;font-size:15px;font-family:'JetBrains Mono',monospace;
  width:100%;max-width:300px;margin-bottom:12px;outline:none;transition:.3s}
.login-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,212,255,0.1)}

/* ── TELA BOAS-VINDAS ── */
.welcome-title{
  font-size:clamp(1.8rem,4.5vw,3.4rem);
  line-height:1.15;font-weight:900;letter-spacing:-.03em;margin-bottom:20px;
  background:linear-gradient(135deg,#ffffff 0%,var(--cyan) 35%,var(--purple) 65%,var(--pink) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:fadeUp 1s cubic-bezier(.16,1,.3,1) .15s both}
.welcome-sub{color:var(--muted);font-size:1rem;line-height:1.85;max-width:560px;
  margin-bottom:38px;animation:fadeUp 1s cubic-bezier(.16,1,.3,1) .3s both}
.sys-tag{position:absolute;font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(0,212,255,0.2);letter-spacing:.04em}

/* ... [ESTILOS ANTERIORES MANTIDOS] ... */

</style>
</head>
<body>

<canvas id="particles"></canvas>
<div class="grid-bg"></div>
<div class="aurora"><div class="au au1"></div><div class="au au2"></div><div class="au au3"></div></div>
<div class="scanline"></div>
<div class="cursor-glow" id="cursorGlow"></div>

<div class="notify" id="notify">
  <div class="notify-icon" id="notifyIcon">💚</div>
  <div>
    <div class="notify-title" id="notifyTitle"></div>
    <div class="notify-sub" id="notifySub"></div>
  </div>
</div>

<section class="screen" id="welcomeScreen">
  <div class="glass">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div class="sys-tag" style="top:18px;right:24px">SYS_v3.0 ■ ONLINE</div>
    <div class="badge"><span class="live-dot"></span>FuturaOS_Tasks — Sistema Premium</div>
    <h1 class="welcome-title">Olá, seja muito bem‑vindo ao FuturaOS_Tasks.</h1>
    <p class="welcome-sub">Tecnologia de ponta ao seu alcance. Realize o login para acessar os recursos.</p>
    
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px;">
        <input type="text" id="loginEmail" class="login-input" placeholder="Seu e-mail de acesso">
        <input type="password" id="loginSenha" class="login-input" placeholder="Sua senha">
    </div>

    <div style="display:flex;gap:14px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="doLogin()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Entrar no sistema
      </button>
    </div>
    <div class="sys-tag" style="bottom:20px;left:24px">SESSION: FT-2026 // SECURE</div>
  </div>
</section>

<script>
async function doLogin() {
    const email = document.getElementById('loginEmail').value;
    const senha = document.getElementById('loginSenha').value;
    const rlUrl = 'https://script.google.com/macros/s/AKfycbzzyrodBL4depn_cLvD1HEmCuLzaY-XyKx2ksoMiOPaBF9He513l9HwuaoIWxqKLlHyPg/exec';

    if (!email || !senha) {
        showNotify('Erro', 'Por favor, preencha todos os campos.');
        return;
    }

    try {
        const response = await fetch(`${rlUrl}?email=${encodeURIComponent(email)}&senha=${encodeURIComponent(senha)}`);
        const data = await response.json();

        if (data.status === 'success') {
            enterMain();
        } else {
            showNotify('Falha no Login', 'Dados incorretos ou acesso negado.');
        }
    } catch (error) {
        showNotify('Erro de Conexão', 'Não foi possível contatar o servidor.');
    }
}

function showNotify(title, sub) {
    const n = document.getElementById('notify');
    document.getElementById('notifyTitle').innerText = title;
    document.getElementById('notifySub').innerText = sub;
    n.classList.add('show');
    setTimeout(() => n.classList.remove('show'), 4000);
}

function enterMain() {
    document.getElementById('welcomeScreen').classList.add('hidden');
    document.getElementById('mainPage').classList.remove('hidden');
}
</script>

</body>
</html>
