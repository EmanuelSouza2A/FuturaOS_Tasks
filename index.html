<script>
// 1. CONFIGURAÇÃO DO LOGIN E COMUNICAÇÃO
const WEB_APP_URL = "SEU_LINK_DO_GOOGLE_APP_SCRIPT_AQUI"; // Cole o link do seu /exec

function doLogin() {
    const email = document.getElementById('loginEmail')?.value;
    const senha = document.getElementById('loginSenha')?.value;
    
    if(!email || !senha) {
        showNotify('⚠️', 'Atenção', 'Preencha os campos de acesso.');
        return;
    }

    fetch(`${WEB_APP_URL}?email=${encodeURIComponent(email)}&senha=${encodeURIComponent(senha)}`)
        .then(res => res.json())
        .then(data => {
            if(data.status === "sucesso") {
                showNotify('✅', 'Acesso Liberado', 'Bem-vindo ao painel.');
                enterMain();
            } else {
                showNotify('❌', 'Acesso Negado', 'Credenciais inválidas.');
            }
        })
        .catch(err => {
            console.error(err);
            showNotify('🚨', 'Erro', 'Falha na conexão com o servidor.');
        });
}

// 2. FUNÇÃO DE NOTIFICAÇÃO (Mantendo seu padrão)
function showNotify(icon, title, sub) {
    const n = document.getElementById('notify');
    document.getElementById('notifyIcon').textContent = icon;
    document.getElementById('notifyTitle').textContent = title;
    document.getElementById('notifySub').textContent = sub;
    n.classList.add('show');
    setTimeout(() => n.classList.remove('show'), 3000);
}

// 3. SEU SCRIPT DE PARTÍCULAS E NAVEGAÇÃO (Mantenha o resto que você já tinha)
function enterMain() {
    document.getElementById('welcomeScreen').classList.add('hidden');
    document.getElementById('donationScreen').classList.add('hidden');
    document.getElementById('mainPage').classList.remove('hidden');
}

function goToDonation() {
    document.getElementById('welcomeScreen').classList.add('hidden');
    document.getElementById('donationScreen').classList.remove('hidden');
}
</script>
