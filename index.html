<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>FuturaOS_Tasks</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#020408;--cyan:#00d4ff;--purple:#7c3aed;--pink:#ec4899;
  --green:#00ff88;--orange:#ff6b00;--red:#ef4444;
  --text:#e8f4ff;--muted:#4a6a8a;
  --border:rgba(0,212,255,0.08);--border-hi:rgba(0,212,255,0.22);
}
html,body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;font-family:'Inter',sans-serif}
.hidden{display:none!important}
.btn:disabled{opacity:.5;cursor:not-allowed!important}
#btnPremium:disabled{opacity:.5;cursor:not-allowed!important}
#btnPremium.enabled{opacity:1;cursor:pointer!important;background:linear-gradient(135deg,#00ff88,#0ea5e9);color:#fff}
#particles{position:fixed;inset:0;z-index:0;pointer-events:none}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(0,212,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.025) 1px,transparent 1px);background-size:50px 50px;mask-image:radial-gradient(ellipse 85% 85% at 50% 50%,black,transparent);-webkit-mask-image:radial-gradient(ellipse 85% 85% at 50% 50%,black,transparent)}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.au{position:absolute;border-radius:50%}
.au1{width:900px;height:900px;background:radial-gradient(circle,rgba(0,212,255,0.055),transparent 70%);top:-250px;left:-250px;animation:au1 14s ease-in-out infinite}
.au2{width:750px;height:750px;background:radial-gradient(circle,rgba(124,58,237,0.065),transparent 70%);bottom:-200px;right:-150px;animation:au2 17s ease-in-out infinite}
.au3{width:550px;height:550px;background:radial-gradient(circle,rgba(236,72,153,0.04),transparent 70%);top:35%;left:35%;animation:au3 11s ease-in-out infinite}
@keyframes au1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(120px,90px) scale(1.12)}}
@keyframes au2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-90px,-70px) scale(1.18)}}
@keyframes au3{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.25)}}
.scanline{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.012) 3px,rgba(0,0,0,0.012) 6px);animation:scan 12s linear infinite}
@keyframes scan{from{background-position:0 0}to{background-position:0 200px}}
.cursor-glow{position:fixed;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,255,0.03),transparent 70%);pointer-events:none;transform:translate(-50%,-50%);z-index:1;will-change:left,top}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 20px;position:relative;z-index:10}
.glass{width:100%;max-width:960px;background:rgba(6,10,20,0.88);border:1px solid var(--border-hi);box-shadow:0 0 80px rgba(0,212,255,0.04),0 40px 100px rgba(0,0,0,0.85),inset 0 1px 0 rgba(0,212,255,0.08);backdrop-filter:blur(36px);border-radius:28px;padding:48px;position:relative;overflow:hidden}
.welcome-title{font-size:clamp(1.8rem,4.5vw,3.4rem);line-height:1.15;font-weight:900;letter-spacing:-.03em;margin-bottom:20px;background:linear-gradient(135deg,#ffffff 0%,var(--cyan) 35%,var(--purple) 65%,var(--pink) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.welcome-sub{color:var(--muted);font-size:1rem;line-height:1.85;max-width:560px;margin-bottom:38px}
.btn{border:none;cursor:pointer;border-radius:14px;padding:15px 28px;font-size:15px;font-weight:700;font-family:'Inter',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;position:relative;overflow:hidden;transition:all .3s cubic-bezier(.16,1,.3,1)}
.btn-primary{background:linear-gradient(135deg,#0ea5e9,var(--purple),var(--pink));color:#fff}
.btn-green{background:linear-gradient(135deg,#059669,#0ea5e9);color:#fff}
.paywall-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.pw-panel{background:rgba(255,255,255,0.016);border:1px solid var(--border);border-radius:20px;padding:30px;display:flex;flex-direction:column;gap:16px}
.pw-title{font-size:1.25rem;font-weight:900;background:linear-gradient(135deg,#fff,var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.pw-title.green{background:linear-gradient(135deg,#fff,var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.pw-desc{color:var(--muted);font-size:13.5px;line-height:1.75}
.timer-display{font-size:3.5rem;font-weight:900;font-family:'JetBrains Mono',monospace;text-align:center;background:linear-gradient(135deg,var(--green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.cards-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:32px}
.card{background:rgba(6,10,20,0.88);border:1px solid var(--border);border-radius:22px;padding:26px;cursor:pointer}
.hidden{display:none!important}
@media(max-width:900px){.paywall-grid{grid-template-columns:1fr}.cards-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:580px){.cards-grid{grid-template-columns:1fr}.glass{padding:26px;border-radius:22px}}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="grid-bg"></div>
<div class="aurora"><div class="au au1"></div><div class="au au2"></div><div class="au au3"></div></div>
<div class="scanline"></div>
<div class="cursor-glow" id="cursorGlow"></div>

<section class="screen" id="welcomeScreen">
  <div class="glass">
    <h1 class="welcome-title">Olá, seja muito bem‑vindo ao FuturaOS_Tasks.</h1>
    <p class="welcome-sub">A suíte de automações educacionais mais avançada do Brasil.</p>
    <button class="btn btn-primary" onclick="goToPaywall()">Acessar o sistema</button>
  </div>
</section>

<section class="screen hidden" id="paywallScreen">
  <div class="glass" style="max-width:1020px">
    <div class="paywall-grid">
      <div class="pw-panel">
        <div class="pw-title">⚡ Acesso Premium</div>
        <p class="pw-desc">Escolha um plano e libere o acesso total.</p>
        <a class="btn btn-primary" href="https://www.mercadopago.com.br/subscriptions/checkout?preapproval_plan_id=dfbb590c7f8d4e7e931889420b6a00db" target="_blank" rel="noopener">Plano Semanal</a>
        <a class="btn btn-primary" href="https://www.mercadopago.com.br/subscriptions/checkout?preapproval_plan_id=58d53f9eb7a54cab9e53a2c862615ddf" target="_blank" rel="noopener">Plano Mensal</a>
        <button class="btn btn-green" id="btnPremium" disabled>🔒 Aguardando confirmação do pagamento...</button>
      </div>
      <div class="pw-panel">
        <div class="pw-title green">⏱ Acesso Gratuito</div>
        <div class="timer-display" id="timerDisplay">10:00</div>
        <button class="btn btn-primary" onclick="iniciarTimer()">Iniciar contagem gratuita</button>
      </div>
    </div>
  </div>
</section>

<main class="hidden" id="mainPage"></main>

<script>
const WORKER_URL = 'https://fancy-sunset-fd9e.souzacarisemanuelfelipe4.workers.dev';
function getUserId(){let id=localStorage.getItem('ft_user_id');if(!id){id='ft_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10);localStorage.setItem('ft_user_id',id)}return id}
function goToPaywall(){document.getElementById('welcomeScreen').classList.add('hidden');document.getElementById('paywallScreen').classList.remove('hidden');startPolling()}
let pollInterval=null;
async function checkPremiumStatus(){
  try{
    const res=await fetch(`${WORKER_URL}/api/get-script`,{method:'POST',headers:{'Content-Type':'application/json','X-User-Id':getUserId()},body:JSON.stringify({userId:getUserId(),scriptId:1})});
    const data=await res.json();
    if(data.status==='liberado'){
      const btn=document.getElementById('btnPremium');
      btn.disabled=false;
      btn.textContent='🚀 Pagamento Confirmado! Clique aqui para Entrar';
      btn.style.opacity='1';
      btn.style.cursor='pointer';
      btn.style.background='linear-gradient(135deg,#00ff88,#0ea5e9)';
      localStorage.setItem('ft_modo','premium');
      clearInterval(pollInterval);
    }
  }catch(e){}
}
function startPolling(){if(pollInterval)return;checkPremiumStatus();pollInterval=setInterval(checkPremiumStatus,4000)}
</script>
</body>
</html>
