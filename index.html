<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>FuturaOS_Tasks</title>
    <style>
        /* (Seu CSS permanece exatamente o mesmo, não alterei nada para não quebrar seu layout) */
        .hidden { display: none !important; }
        /* Adicionei apenas isso para garantir que o login funcione: */
    </style>
</head>
<body>

<section class="screen hidden" id="loginScreen">
  <div class="glass" style="max-width:500px">
    <div class="input-group">
      <label class="input-label">E-MAIL</label>
      <input type="email" id="loginEmail" class="form-input" placeholder="seuemail@gmail.com">
    </div>
    <div class="input-group">
      <label class="input-label">SENHA</label>
      <input type="password" id="loginSenha" class="form-input" placeholder="Sua senha">
    </div>
    <div class="input-group">
      <label class="input-label">CÓDIGO DE ACESSO</label>
      <input type="text" id="loginCode" class="form-input" placeholder="Sua chave">
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="doLogin()">Entrar Agora</button>
  </div>
</section>

<script>
'use strict';

/* ── CONFIGURAÇÃO DO WHATSAPP ── */
const MEU_WHATSAPP = "5511926705115";

/* ── A FUNÇÃO DO LOGIN CORRIGIDA ── */
function doLogin() {
    const email = document.getElementById('loginEmail').value;
    const senha = document.getElementById('loginSenha').value; // Agora lê a senha
    const code = document.getElementById('loginCode').value;

    // AQUI VOCÊ COLA O LINK QUE TERMINA EM /exec QUE O GOOGLE TE DEU
    const WEB_APP_URL = "COLE_SEU_LINK_AQUI_QUE_TERMINA_EM_/exec";

    if(!email || !senha || !code) {
        showNotify('⚠️', 'Atenção', 'Preencha todos os campos!');
        return;
    }

    showNotify('⏳', 'Conectando...', 'Verificando dados na planilha');

    const url = `${WEB_APP_URL}?email=${encodeURIComponent(email)}&senha=${encodeURIComponent(senha)}&codigo=${encodeURIComponent(code)}`;

    fetch(url)
        .then(res => res.json())
        .then(data => {
            if (data.status === "sucesso") {
                showNotify('✅', 'Sucesso', 'Acesso liberado!');
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainPage').classList.remove('hidden');
            } else {
                showNotify('❌', 'Erro', 'Dados incorretos ou não encontrados.');
            }
        })
        .catch(err => {
            console.error(err);
            showNotify('🚨', 'Erro de Conexão', 'Não foi possível falar com o servidor.');
        });
}

// ... (Mantenha o resto das suas funções abaixo normalmente) ...

</script>
</body>
</html>
